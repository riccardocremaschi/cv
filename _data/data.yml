experiences:
  title: Esperienze lavorative
  info:
    - role: Analista funzionale & Team leader
      time: 2022 - Presente
      company: Datev.IT SPA
      details: |
        - Referente funzionale del progetto di contabilità automatica basato su machine learning per la registrazione delle fatture elettroniche.
        - Responsabile della migrazione web del software Gestione Immobili, coordinando 3 sviluppatori e 2 tester, con pianificazione delle attività, gestione delle priorità e attenzione alla continuità operativa.
        - Gestione degli aggiornamenti normativi del mondo immobili, pianificando e monitorando le attività per rispettare scadenze e rilasci.
        - Supporto funzionale e coordinamento con le diverse aree aziendali nella transizione da piattaforme legacy a soluzioni web.
    - role: Consulente applicativo
      time: 2014 - 2022
      company: Zucchetti SPA
      details: |
        - Coordinamento operativo di progetti software per clienti medio-grandi, organizzando il lavoro dei gruppi coinvolti, definendo priorità e monitorando scadenze e criticità.
        - Gestione di circa 100 studi professionali e 10 associazioni di categoria, curando i rapporti con i clienti e monitorando l'avanzamento delle commesse.
        - Consulenza e formazione applicativa, con stima delle ore di intervento e proposta di servizi aggiuntivi in base alle esigenze dei clienti.
    - role: Assistenza clienti & Analista conversione dati
      time: 2009 - 2014
      company: Zucchetti SPA
      details: |
        - Analisi, progettazione e supervisione dello sviluppo di strumenti di conversione dati, verificandone qualità e affidabilità.
        - Assistenza applicativa e tecnica ai clienti.
