career-profile:
  title: Profilo
  summary: |
    Analista funzionale con oltre 15 anni di esperienza nel settore software gestionale, maturata nella consulenza applicativa, nell’analisi dei processi e nella gestione di progetti complessi per clienti medio-grandi.

    Ho sviluppato competenze nel coordinamento operativo di gruppi di lavoro, nella pianificazione delle attività, nella gestione delle commesse e nel rapporto con clienti e diverse aree aziendali, monitorando avanzamenti, priorità e scadenze.

    Unisco competenze tecniche, organizzative e relazionali con un approccio pratico e analitico, orientato al raggiungimento degli obiettivi, alla risoluzione delle criticità e al miglioramento dei processi aziendali.
